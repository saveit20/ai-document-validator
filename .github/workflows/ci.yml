name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Evaluation quality gate (heuristic)
        run: python -m evals.run --extractor heuristic --check-baseline
      - name: Evaluation quality gate (Opus 5 on test, replayed from recordings)
        run: python -m evals.run --extractor llm --model claude-opus-5 --split test --check-baseline
      - name: Evaluation quality gate (hybrid on test, replayed from recordings)
        run: python -m evals.run --extractor hybrid --model claude-opus-5 --split test --check-baseline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down
